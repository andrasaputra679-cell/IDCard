<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risa Rusmaniah</title>
<style>
  :root{
    --navy:#12202f;
    --navy-deep:#0b1620;
    --steel:#3c556b;
    --gold:#a9824c;
    --paper:#eef1f3;
    --card:#ffffff;
    --ink:#1a2530;
    --muted:#6b7885;
    --line:#e2e6ea;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--paper);
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:360px;
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 24px 48px -24px rgba(11,22,32,0.35),
      0 2px 6px rgba(11,22,32,0.08);
  }

  /* panel foto: latar blur dari foto sendiri (otomatis senada warnanya),
     foto utama ditampilkan utuh tanpa terpotong - cocok untuk full body
     maupun close-up dada ke atas */
  .header-panel{
    position:relative;
    height:280px;
    background:linear-gradient(180deg, var(--navy-deep), var(--navy));
    overflow:hidden;
  }

  .photo-bg{
    position:absolute;
    inset:-25px;
    width:calc(100% + 50px);
    height:calc(100% + 50px);
    object-fit:cover;
    object-position:center 20%;
    filter:blur(26px) brightness(0.55) saturate(1.15);
    transform:scale(1.1);
  }

  .photo-fg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    z-index:1;
    filter:drop-shadow(0 8px 18px rgba(11,22,32,0.45));
  }

  /* scrim halus atas untuk keterbacaan label */
  .header-panel::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:70px;
    background:linear-gradient(180deg, rgba(11,22,32,0.55), rgba(11,22,32,0));
    z-index:2;
  }

  /* scrim halus bawah supaya foto melebur rapi ke badan kartu putih */
  .header-panel::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:56px;
    background:linear-gradient(180deg, rgba(255,255,255,0), var(--card));
    z-index:2;
  }

  .eyebrow{
    position:absolute;
    top:16px;
    left:22px;
    font-size:10.5px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    z-index:3;
  }

  .kode-tag{
    position:absolute;
    top:16px;
    right:22px;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.75);
    font-weight:500;
    z-index:3;
  }

  .body{
    padding:14px 28px 30px;
    text-align:center;
  }

  .nama{
    font-size:21px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  .jabatan{
    margin-top:4px;
    font-size:11.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
  }

  .info-list{
    margin-top:18px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 2px;
  }

  .info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 4px;
    font-size:13.5px;
  }

  .info-row + .info-row{
    border-top:1px solid var(--line);
  }

  .info-label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-weight:500;
    letter-spacing:0.02em;
  }

  .info-icon{
    width:16px;
    text-align:center;
    color:var(--steel);
  }

  .info-value{
    font-weight:700;
    color:var(--ink);
  }

  .info-value a{
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
  }

  .quote-box{
    margin-top:18px;
  }

  .quote-mark{
    font-size:30px;
    font-family:Georgia, serif;
    color:var(--gold);
    line-height:0.6;
  }

  .quote{
    font-style:italic;
    font-size:14px;
    line-height:1.6;
    color:#4a5560;
    margin-top:6px;
  }

  .footer-line{
    margin-top:20px;
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#a7b0b8;
  }

  @media (max-width: 380px){
    .header-panel{height:250px;}
    .nama{font-size:19px;}
  }
</style>
</head>
<body>

  <div class="card">

    <div class="header-panel">
      <img class="photo-bg" src="../foto/Risa Rusmaniah.png" alt="">
      <img class="photo-fg" src="../foto/Risa Rusmaniah.png" alt="Foto Risa Rusmaniah">
      <div class="eyebrow">Kartu Profil</div>
      <div class="kode-tag">ID-052</div>
    </div>

    <div class="body">
      <div class="nama">Risa Rusmaniah</div>
      <div class="jabatan">Sekretaris 2</div>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label"><span class="info-icon">🏢</span> Cabang</span>
          <span class="info-value">Pontianak</span>
        </div>
        <div class="info-row">
          <span class="info-label"><span class="info-icon">📱</span> No. HP</span>
          <span class="info-value"><a href="tel:6285787070887">085787070887</a></span>
        </div>
        <div class="info-row">
          <span class="info-label"><span class="info-icon">👕</span> Ukuran Baju</span>
          <span class="info-value">XL</span>
        </div>
      </div>

      <div class="quote-box">
        <div class="quote-mark">"</div>
        <div class="quote">Rasa lelah bisa jadi tanda bahwa kamu sedang berjalan menuju sesuatu yang besar.</div>
      </div>

      <div class="footer-line">Kartu Identitas Digital</div>
    </div>

  </div>

</body>
</html>
